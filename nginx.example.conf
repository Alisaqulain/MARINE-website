# Example nginx site for marinamuseinternational.com (Ubuntu + Node next start).
# Replace /var/www/marina-muse with your app path on KVM.

server {
    listen 80;
    listen [::]:80;
    server_name marinamuseinternational.com www.marinamuseinternational.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marinamuseinternational.com www.marinamuseinternational.com;

    # Product photos from phones can be several MB (the app also allows up to 12 MB).
    client_max_body_size 15M;

    # ssl_certificate /etc/letsencrypt/live/marinamuseinternational.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/marinamuseinternational.com/privkey.pem;

    root /var/www/marina-muse/public;

    # Serve Next build assets from disk (CSS + JS must both exist after npm run build)
    location /_next/static/ {
        alias /var/www/marina-muse/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
